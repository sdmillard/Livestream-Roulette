<!doctype html>
<meta charset="utf-8">
<title>Livestream Roulette browser checks</title>
<pre id="result">Running</pre>
<script type="module">
const key = 'livestream-roulette-v1';
const baseline = localStorage.getItem(key);
const result = document.getElementById('result');

function check(condition, message) {
  if (!condition) throw new Error(message);
}

function openApp(query = '') {
  return new Promise(resolve => {
    const frame = document.createElement('iframe');
    frame.onload = () => resolve(frame);
    frame.src = '../index.html' + query;
    document.body.append(frame);
  });
}

const stream = (id, props = {}) => ({
  id, title: id, institution: 'Test fixture', collection: 'Wildlife',
  embed: 'https://example.invalid/' + id, original: 'https://example.invalid/watch', ...props
});

try {
  localStorage.setItem(key, JSON.stringify({
    streams: [stream('first'), stream('second'), stream('closed', {
      schedule: { timezone: 'Invalid/Zone', start: '07:00', end: '19:00' }
    }), stream('blocked', { embed: 'https://youtu.be/test' })]
  }));
  const frame = await openApp();
  const doc = frame.contentDocument;
  const el = id => doc.getElementById(id);
  const buttons = () => [...doc.querySelectorAll('#sources .item button:first-child')];
  check(el('player').hidden, 'Default settings must block generic iframe audio');
  check(buttons().every(button => button.disabled), 'Ineligible cameras must disable manual Play');
  check(el('menuActions').hidden, 'Playback actions start collapsed');
  el('menu').click();
  check(!el('menuActions').hidden, 'Menu reveals playback actions');
  el('playback').click();
  check(!el('playbackPanel').hidden && !el('menuActions').hidden, 'Playback opens beside its parent');
  el('settings').click();
  check(el('playbackPanel').hidden, 'Opening Settings replaces the Playback submenu');
  check(!el('panel').hidden, 'Settings opens');
  el('settings').click();
  check(el('panel').hidden && !el('menuActions').hidden, 'Clicking the active row closes its submenu');
  check(doc.activeElement === el('settings'), 'Closing restores focus to the parent row');
  el('settings').click();
  el('rotationCategory').click();
  check(!el('rotationSettings').hidden && !el('panel').hidden, 'Rotation opens while its parent stays visible');
  el('displayCategory').click();
  check(el('rotationSettings').hidden && !el('displaySettings').hidden, 'Category selection replaces the previous detail panel');
  el('rotationCategory').click();
  el('interval').dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  check(el('rotationSettings').hidden && !el('panel').hidden, 'Escape closes only the settings detail');
  check(doc.activeElement === el('rotationCategory'), 'Escape restores focus to the category row');
  el('rotationCategory').dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  check(el('panel').hidden && !el('menuActions').hidden, 'Escape returns to the parent menu');
  el('settings').click();
  el('displayCategory').click();
  el('startMuted').click();
  check(!el('player').hidden, 'Audio opt-in enables generic embeds');
  check(buttons()[2].disabled && buttons()[3].disabled, 'Schedule and YouTube checks apply to Play');
  const first = el('player').getAttribute('src');
  el('playback').click();
  el('info').click();
  check(!el('cameraDetails').hidden && !el('playbackPanel').hidden, 'Camera info opens alongside Playback');
  check(el('meta').hidden, 'Opening camera info leaves the optional overlay hidden');
  check(el('detailOriginal').href === 'https://example.invalid/watch', 'Camera details show the source link');
  el('next').click();
  check(el('player').getAttribute('src') !== first, 'Next avoids immediate repetition');
  check(el('detailTitle').textContent === el('title').textContent, 'Camera details follow the selected stream');
  el('previous').click();
  check(el('player').getAttribute('src') === first, 'Back restores the previous camera');
  el('hold').click();
  check(el('hold').getAttribute('aria-pressed') === 'true', 'Stay here marks rotation as held');
  el('settings').click();
  check(el('cameraDetails').hidden, 'Switching branches closes camera info');
  el('camerasCategory').click();
  check(!el('cameraSettings').hidden, 'Cameras reveals collection and source settings');
  el('wildlife').click();
  check(el('player').hidden, 'Collection changes clear ineligible players while held');
  frame.remove();

  const wallpaper = await openApp('?wallpaper=1');
  check(!wallpaper.contentDocument.getElementById('wildlife').checked, 'Settings persisted');
  check(wallpaper.contentDocument.getElementById('player').hidden, 'Wallpaper mode skips generic iframe');
  check(wallpaper.contentWindow.getComputedStyle(
    wallpaper.contentDocument.querySelector('nav')
  ).display === 'none', 'Wallpaper controls are hidden');
  wallpaper.remove();
  result.textContent = 'PASS';
} catch (error) {
  result.textContent = 'FAIL: ' + error.message;
} finally {
  if (baseline === null) localStorage.removeItem(key);
  else localStorage.setItem(key, baseline);
}
</script>
